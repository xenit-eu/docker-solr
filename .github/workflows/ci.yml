name: 'Continuous Integration'
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '7 0 * * SUN'
env:
  GRADLE_OPTS: >-
    -Dorg.gradle.project.eu.xenit.cloudsmith.username=${{ secrets.CLOUDSMITH_USER }} 
    -Dorg.gradle.project.eu.xenit.cloudsmith.password=${{ secrets.CLOUDSMITH_APIKEY }}    
    -Dorg.gradle.project.org.alfresco.maven.nexus.username=${{ secrets.ALFRESCO_NEXUS_USERNAME }} 
    -Dorg.gradle.project.org.alfresco.maven.nexus.password=${{ secrets.ALFRESCO_NEXUS_PASSWORD }}
jobs:
  integration-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - solr6
        # One runner per search-services version: every task for that version runs
        # here, instead of one runner walking all versions for a single task.
        assetVersion:
          - alfresco-search-services-community-1.4.3.4
          - alfresco-search-services-community-2.0.6
          - alfresco-search-services-community-2.0.8.2
          - alfresco-search-services-community-2.0.9.1
          - alfresco-search-services-enterprise-1.4.3.4
          - alfresco-search-services-enterprise-2.0.6
          - alfresco-search-services-enterprise-2.0.8.2
          - alfresco-search-services-enterprise-2.0.9.1
    env:
      UPSTREAM_PROJECT: ':upstream:${{ matrix.version }}-${{ matrix.assetVersion }}'
      XENIT_PROJECT: ':xenit:${{ matrix.version }}-${{ matrix.assetVersion }}'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # 11 for the code that ends up in the images, 21 for the integration tests.
          # Gradle toolchains automatically pick the correct one.
          java-version: |
            11
            21
      - name: install docker-compose
        run: sudo apt-get install docker-ce docker-compose
      - name: Add license
        run: |
          touch ./src/integrationTest/resources/license61/license.lic
          echo ${{secrets.ALFRESCO_LICENSE61}} > ./src/integrationTest/resources/license61/license.lic
          chmod 666 ./src/integrationTest/resources/license61/license.lic
      - name: Login to Docker
        run: |
          echo '${{ secrets.HARBOR_PASSWORD }}' | docker login docker.xenit.eu --username '${{ secrets.HARBOR_USER }}' --password-stdin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Integration tests
        env:
          VERSIONS_TO_BUILD: ${{ matrix.version }}
        # Single Gradle invocation so the upstream image is built once and reused
        # by the xenit image. Tasks run sequentially, so the compose stacks (which
        # share fixed container names) never overlap.
        run: |
          ./gradlew \
            "${{ env.UPSTREAM_PROJECT }}:integrationTestDefault" \
            "${{ env.UPSTREAM_PROJECT }}:integrationTestSharded" \
            "${{ env.UPSTREAM_PROJECT }}:integrationTestShardedNonSsl" \
            "${{ env.UPSTREAM_PROJECT }}:integrationTestNonSsl" \
            "${{ env.UPSTREAM_PROJECT }}:integrationTestMounts" \
            "${{ env.XENIT_PROJECT }}:integrationTestXenitEndpoints" \
            --info
      - name: Upload Artifact
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.version }}-${{ matrix.assetVersion }}-result
          path: /home/runner/work/**/build/reports
          retention-days: 2
  publish:
    needs: [ integration-test ]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/heads/release') }}
    strategy:
      matrix:
        version:
          - solr6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            11
            21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Login to docker repo
        run: |
          echo '${{ secrets.HARBOR_PASSWORD }}' | docker login docker.xenit.eu --username '${{ secrets.HARBOR_USER }}' --password-stdin
      # We have to split out publishing to public and private repo's because pushing to docker.io does not seem to work
      # without supplying DOCKER_USER and DOCKER_PASSWORD. However, supplying those environment variables breaks
      # publishing to other repositories
      - name: Publish public docker images
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          VERSIONS_TO_BUILD: ${{ matrix.version }}
        run: ./gradlew pushDockerImage -PincludeEnterprise=false
      - name: Publish private docker images
        env:
          VERSIONS_TO_BUILD: ${{ matrix.version }}
        run: ./gradlew pushDockerImage -PincludeCommunity=false